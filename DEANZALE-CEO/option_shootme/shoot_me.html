<html lang="en">
<head>
<meta charset="UTF-8">

<title>DeanZ SDLab SHOOT ME</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: black;
}

/* VIDEO */
video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: 1;
    transition: opacity 0.8s ease;
}

/* BLACK SCREEN */
.blackout {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.8s ease;
}

/* CONTENT */
.container {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.title {
    font-size: 3.2vw;
    color: white;
    background: rgba(0,0,0,0.35);
    padding: 2vw 3vw;
    border-radius: 2vw;
    backdrop-filter: blur(8px);
}

.link {
    text-decoration: none;
    font-weight: bold;
    color: #00eaff;
}
</style>
</head>

<body>

<video id="bgVideo" muted playsinline></video>
<div class="blackout" id="blackout"></div>

<script>
const videos = [
"videos/video1.mp4","videos/video2.mp4","videos/video3.mp4","videos/video4.mp4","videos/video5.mp4",
"videos/video6.mp4","videos/video7.mp4","videos/video8.mp4","videos/video9.mp4","videos/video10.mp4",
"videos/video11.mp4","videos/video12.mp4","videos/video13.mp4","videos/video14.mp4","videos/video15.mp4",
"videos/video16.mp4","videos/video17.mp4","videos/video18.mp4","videos/video19.mp4","videos/video20.mp4",
"videos/video21.mp4","videos/video22.mp4","videos/video23.mp4","videos/video24.mp4","videos/video25.mp4",
"videos/video26.mp4","videos/video27.mp4","videos/video28.mp4","videos/video29.mp4","videos/video30.mp4",
"videos/video31.mp4","videos/video32.mp4","videos/video33.mp4","videos/video34.mp4","videos/video35.mp4",
"videos/video36.mp4","videos/video37.mp4","videos/video38.mp4","videos/video39.mp4","videos/video40.mp4",
"videos/video41.mp4","videos/video42.mp4","videos/video43.mp4","videos/video44.mp4","videos/video45.mp4",
"videos/video46.mp4","videos/video47.mp4","videos/video48.mp4","videos/video49.mp4","videos/video50.mp4"
];

let currentIndex = -1;

const video = document.getElementById("bgVideo");
const blackout = document.getElementById("blackout");

/* RANDOM NO REPEAT */
function getRandomVideo() {
    let i;
    do {
        i = Math.floor(Math.random() * videos.length);
    } while (i === currentIndex);
    currentIndex = i;
    return videos[i];
}

/* LOAD VIDEO */
function loadVideo(src) {
    video.src = src;
    video.load();

    video.play().catch(() => {
        video.muted = true;
        video.play();
    });
}

/* MAIN LOOP */
function cycle() {

    // STEP 1: SHOW VIDEO FOR 6s
    blackout.style.opacity = 0;
    video.style.opacity = 1;

    loadVideo(getRandomVideo());

    setTimeout(() => {

        // STEP 2: FULL BLACK FOR 9s
        blackout.style.opacity = 1;
        video.style.opacity = 0;

        setTimeout(() => {

            // STEP 3: NEXT CYCLE
            cycle();

        }, 9000); // full blackout duration

    }, 6000); // visible video duration
}

/* START */
cycle();
</script>
