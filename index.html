<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SDLab 2020™ ZOS 'NO KEYBOARD' Operating System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: url('images/bg1.jpg') no-repeat center center/cover;
    transition: background 0.3s ease;
    font-family: Arial, sans-serif;
}

/* ===== VIDEO BACKGROUND ===== */
.video-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    display: none;
}

.video-bg video {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 2s ease;
}

/* ===== TOP TITLE ===== */
.top-title {
    position: absolute;
    top: 0;
    width: 100%;
    text-align: center;
    padding: 1vh 0;
    z-index: 10;
    border-bottom: 1px solid rgba(0,255,255,0.3);
}

.top-title h1 {
    color: #00ffff;
    font-size: 2.2vw;
    text-shadow: 0 0 15px #00ffff;
}

.top-title h2 {
    color: #ff0066;
    font-size: 1.2vw;
}

/* ===== BOTTOM ===== */
.bottom-area {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 10vh;
    display: flex;
    flex-direction: column;
}

.top-row {
    flex: 7;
    display: flex;
}

.hover-zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #00ffff;
    font-size: 1.2vw;
    cursor: pointer;
    background: rgba(0,255,255,0.05);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(0,255,255,0.3);
    transition: all 0.25s ease;
}

.hover-zone:hover {
    color: white;
    transform: scale(1.05);
}

/* COLORS */
.hover-zone:nth-child(2) { color: #00ff99; }
.hover-zone:nth-child(3) { color: #66ff00; }
.hover-zone:nth-child(4) { color: #ffff00; }
.hover-zone:nth-child(5) { color: #ffcc00; }
.hover-zone:nth-child(6) { color: #ff6600; }
.hover-zone:nth-child(7) { color: #ff0066; }
.hover-zone:nth-child(8) { color: #cc00ff; }
.hover-zone:nth-child(9) { color: #6600ff; }
.hover-zone:nth-child(10){ color: #00ccff; }

/* bottom row */
.bottom-row {
    flex: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: black;
    padding: 0 1vw;
}

.center-text {
    flex: 1;
    text-align: center;
    color: #ff0066;
    font-size: 1.2vw;
}
</style>
</head>

<body id="body">

<!-- VIDEO BG -->
<div class="video-bg" id="videoBG">
    <video id="vidA" muted playsinline preload="auto"></video>
    <video id="vidB" muted playsinline preload="auto"></video>
</div>

<!-- TOP -->
<div class="top-title">
    <h1>SDLab 2020: ZOS & OPEN WORLD GAMING ENHANCEMENTS</h1>
    <h2>
        C.E.O. 
        <a href="deanzceo_contact\index.html" target="_blank">Dean Zale</a>
        : ABN 12345678
    </h2>
</div>


<!-- BOTTOM -->
<div class="bottom-area">
    <div class="top-row">
        <div class="hover-zone" onmouseover="setBG(1)">1</div>
        <div class="hover-zone" onmouseover="setBG(2)">2</div>
        <div class="hover-zone" onmouseover="setBG(3)">3</div>
        <div class="hover-zone" onmouseover="setBG(4)">4</div>
        <div class="hover-zone" onmouseover="setBG(5)">5</div>
        <div class="hover-zone" onmouseover="setBG(6)">6</div>
        <div class="hover-zone" onmouseover="setBG(7)">7</div>
        <div class="hover-zone" onmouseover="setBG(8)">8</div>
        <div class="hover-zone" onmouseover="setBG(9)">9</div>
        <div class="hover-zone" onmouseover="setBG(10)">10</div>
    </div>

    <div class="bottom-row">
        <div></div>
        <div class="center-text" id="centerText"></div>
        <div></div>
    </div>
</div>

<script>
const bottomTexts = [
"NO SUCH THING AS A GAMING KEYBOARD!",
"OPEN WORLD ADVENTURING immersion update",
"Dual mouse control system",
"ZOS flat screen innovation",
"VR & AR already perfect",
"ARMA with no keyboard",
"DAYZ with no keyboard",
"ZOS media system",
"ZOS for workstations",
"Ultimate ZOS system"
];

const videoBG = document.getElementById("videoBG");
const vidA = document.getElementById("vidA");
const vidB = document.getElementById("vidB");

let active = vidA;
let next = vidB;

let videoMode = false;
let timer = null;

const videoList = [];
for (let i = 1; i <= 50; i++) {
    videoList.push(`videos/video${i}.mp4`);
}

let lastIndex = -1;

function getRandomVideo() {
    let i;
    do {
        i = Math.floor(Math.random() * videoList.length);
    } while (i === lastIndex);
    lastIndex = i;
    return videoList[i];
}

/* ===== PRELOAD + CROSSFADE ===== */
function prepareNextVideo(callback) {
    next.src = getRandomVideo();
    next.load();

    next.oncanplaythrough = () => {
        next.oncanplaythrough = null;
        callback();
    };
}

function crossfade() {
    if (!videoMode) return;

    prepareNextVideo(() => {
        next.currentTime = 0;
        next.play();

        next.style.opacity = 1;
        active.style.opacity = 0;

        let temp = active;
        active = next;
        next = temp;
    });
}

/* START */
function startVideoMode() {
    if (videoMode) return;

    videoMode = true;
    videoBG.style.display = "block";
    document.body.style.backgroundImage = "none";

    active.src = getRandomVideo();
    active.play();
    active.style.opacity = 1;

    timer = setInterval(crossfade, 7000);
}

/* STOP */
function stopVideoMode() {
    videoMode = false;

    clearInterval(timer);
    timer = null;

    vidA.pause();
    vidB.pause();

    videoBG.style.display = "none";
}

/* MAIN */
function setBG(num) {
    const body = document.getElementById("body");
    const centerText = document.getElementById("centerText");

    centerText.textContent = bottomTexts[num - 1];

    if (num === 1) {
        startVideoMode();
    } else {
        stopVideoMode();
        body.style.backgroundImage = "url('images/bg" + num + ".jpg')";
    }
}
</script>

</body>
</html>
